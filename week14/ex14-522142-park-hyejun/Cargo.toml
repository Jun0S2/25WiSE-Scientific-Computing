[package]
name = "ex14-522142-park-hyejun"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.14", features = ["train", "wgpu", "ndarray", "autodiff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
regex = "1.0"
indicatif = "0.17"
walkdir = "2.4"
rayon = "1.8"

[features]
default = ["wgpu"] # set to use GPU(wgpu)
wgpu = ["burn/wgpu"]